[MODEL]
in_channels = 3
num_classes = 11
ignore_index = 255 # A class index to ignore in loss and metrics

[TRAINING]
# AdamW optimizer parameters
learning_rate = 0.001
weight_decay = 0.00001

# Scheduler: CosineAnnealingWarmRestarts
restart_epochs = 5  # T_0: The number of epochs for the first restart.
min_lr = 1e-7       # The minimum learning rate.

# Loss
aux_loss_weight = 0.4

# Trainer settings
epochs = 200
accelerator = "gpu" # Use "gpu" or "cpu"
devices = 1         # Number of devices to use
precision = "32-true" # Use "16-mixed" for faster training on compatible GPUs

[DATA]
# Path is relative to the project root where train.py is located
data_dir = "./Data/RescueNet"
batch_size = 8
num_workers = 4
image_size = [256, 256] # Height, Width

[PATHS]
# Where to save logs and model checkpoints
log_dir = "./Training_Logs"
# Where to save debug images during validation
debug_image_dir = "./Debug_Images"